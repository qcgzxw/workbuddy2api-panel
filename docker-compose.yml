services:
  wb2api:
    build: .
    container_name: workbuddy2api
    restart: unless-stopped
    # 身份：默认自动适配，无需指定 uid —— 容器以 root 启动，entrypoint.sh 解析目标身份
    # （PUID/PGID → ./data 目录属主 → 10001），必要时对齐挂载目录属主，再 su-exec 降权；
    # app 进程始终非 root（唯一例外是显式 PUID=0 的逃生门）。仅在需要"固定身份"时启用下面这行（非 root 的固定身份下
    # entrypoint 不再自动 chown，需自己保证目录属主一致）：
    # user: "${PUID:-10001}:${PGID:-10001}"
    security_opt: ["no-new-privileges:true"]
    environment:
      - TZ=Asia/Shanghai
      # 身份覆盖（可选）。必须显式透传：compose 的 ${PUID} 只做宿主侧插值
      # （历史上它唯一的消费者是 user:），不透传容器内根本看不到。留空 = 自动适配。
      - PUID=${PUID:-}
      - PGID=${PGID:-}
    ports:
      - "7863:7863"
    volumes:
      - ./auths:/app/auths
      # 配置也在这里（./data/config.json）。**必须是目录挂载**：单文件挂载会让
      # config.json 成为挂载点，而 rename(2) 不允许覆盖挂载点 —— 面板保存恒报 EBUSY。
      # 首次启动若 ./data/config.json 不存在，程序会自动生成一份（随机 api_key，日志打印）。
      - ./data:/app/data
      # 旧版布局迁移用（一次性）：取消注释后 `docker compose up -d --build` 完成迁移（**必须 --build**：
      # 迁移逻辑在新 entrypoint.sh 里，直接 up -d 会复用旧镜像、迁移不会发生），确认后删掉**这一行**。
      # 全新部署**不要**启用——宿主缺少 ./config.json 时 Docker 会把它建成同名目录。
      # 跳过这步的后果：旧配置不会被读取，程序会生成**新的随机 api_key**，客户端全部 401
      # （这条**不会**有专门的日志提醒你，看到「已生成推荐配置」即是此情形）。
      # - ./config.json:/app/config.json:ro
